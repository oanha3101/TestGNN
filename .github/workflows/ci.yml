name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: gnnvp_root
          MARIADB_DATABASE: gnnvp_test
          MARIADB_USER: gnnvp
          MARIADB_PASSWORD: gnnvp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://gnnvp:gnnvp@127.0.0.1:3306/gnnvp_test
      JWT_SECRET_KEY: ci-test-secret
      APP_ENV: development
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install torch (CPU)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - name: Apply schema to test DB
        # SQL files declare `CREATE DATABASE IF NOT EXISTS gnnvp; USE gnnvp;`
        # (fine for docker-compose where MARIADB_DATABASE=gnnvp + root auto-
        # applies them). In CI the service user `gnnvp` only has privileges
        # on `gnnvp_test`, so we strip those two statements before piping
        # the rest into the test DB. Keeps CI isolated from prod DB name.
        run: |
          sudo apt-get update && sudo apt-get install -y mariadb-client
          for f in sql/*.sql; do
            sed -e '/^CREATE DATABASE/Id' -e '/^USE /Id' "$f" \
              | mariadb -h 127.0.0.1 -u gnnvp -pgnnvp gnnvp_test
          done
      - name: Run pytest
        # Exit 5 = "no tests collected" — PR4 lands the real suite.
        # Treat that as success so CI is green on PR5 alone.
        run: pytest -q || [ $? -eq 5 ]
