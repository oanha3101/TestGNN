name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: gnnvp_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Pytest suite uses in-memory SQLite (see backend/tests/conftest.py),
      # so DATABASE_URL only matters for the smoke-import of app.core.config
      # at collection time. Point it at the CI MariaDB so FastAPI startup
      # would also succeed if a future test opts into the real DB.
      DATABASE_URL: mysql+pymysql://root:gnnvp_root@127.0.0.1:3306/gnnvp
      JWT_SECRET_KEY: ci-test-secret
      APP_ENV: development
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install torch (CPU)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - name: Apply schema (root)
        # Run the real SQL files as root so CREATE DATABASE + multi-line
        # CHARACTER SET / COLLATE / USE statements work as written. This
        # matches docker-compose and exercises the exact schema prod uses.
        run: |
          sudo apt-get update && sudo apt-get install -y mariadb-client
          for f in sql/*.sql; do
            mariadb -h 127.0.0.1 -u root -pgnnvp_root < "$f"
          done
      - name: Run pytest
        run: pytest -q
