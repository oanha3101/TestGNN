# Full GNN-VP stack for local dev / demo.
#
# Usage:
#   docker compose up --build
#   docker compose down -v   # wipes volumes (db + ML artifacts)
#
# Services:
#   db       — MariaDB 10.6 (MySQL-compatible), auto-applies schema files.
#   backend  — FastAPI + PyTorch Geometric. Exposes :8000 and /api/v1.
#   frontend — Vite build served by nginx on :5173 (mapped from 80 inside).
#   adminer  — browser DB admin on :8080 (optional, profile "tools").

services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: gnnvp_root
      MARIADB_DATABASE: gnnvp
      MARIADB_USER: gnnvp
      MARIADB_PASSWORD: gnnvp
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Schema / seed files mounted into /docker-entrypoint-initdb.d run
      # only on a fresh volume. Drop volumes with `down -v` to re-init.
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DATABASE_URL: mysql+pymysql://gnnvp:gnnvp@db:3306/gnnvp
      JWT_SECRET_KEY: dev-compose-secret-do-not-use-in-prod
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      BOOTSTRAP_ADMIN_EMAIL: admin@gnn-vp.com
      BOOTSTRAP_ADMIN_PASSWORD: admin123
    ports:
      - "8000:8000"
    volumes:
      # Persist ML artifacts (checkpoints, embeddings, attention tensors)
      # so training history survives container restarts.
      - ml_artifacts:/root/.gnnvp_data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  adminer:
    image: adminer:4
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  db_data:
  ml_artifacts:
